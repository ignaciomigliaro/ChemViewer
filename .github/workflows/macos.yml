name: Apple Silicon build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          uname -m
          sw_vers
          swift --version
          xcodebuild -version
      - name: Build and test ChemViewer
        run: bash scripts/build-macos.sh --require-xctest
      - name: Set up plotting Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Matplotlib figures and energy data
        env:
          CHEMVIEWER_SETUP_PYTHON: python
          PIP_ONLY_BINARY: ':all:'
        run: |
          bash scripts/setup-plotting.sh
          "$HOME/Library/Application Support/ChemViewer/plotting-venv/bin/python3" -m unittest python_tests.test_energy_plot -v
      - name: Validate fragment catalog and UFF cleanup
        env:
          CHEMVIEWER_CHEMISTRY_PYTHON: python
        run: |
          bash scripts/setup-chemistry.sh
          "$HOME/Library/Application Support/ChemViewer/chemistry-venv/bin/python" -m unittest python_tests.test_builder_chemistry -v
      - name: Verify Apple Silicon bundle
        run: |
          file dist/ChemViewer.app/Contents/MacOS/ChemViewer
          lipo -archs dist/ChemViewer.app/Contents/MacOS/ChemViewer | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 dist/ChemViewer.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ChemViewer.app dist/ChemViewer-macos-arm64.zip
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemViewer-macos-arm64
          path: dist/ChemViewer-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
