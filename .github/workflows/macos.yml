name: Apple Silicon build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          uname -m
          sw_vers
          swift --version
          xcodebuild -version
      - name: Build and test ChemViewer
        run: bash scripts/build-macos.sh
      - name: Verify Apple Silicon bundle
        run: |
          file dist/ChemViewer.app/Contents/MacOS/ChemViewer
          lipo -archs dist/ChemViewer.app/Contents/MacOS/ChemViewer | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 dist/ChemViewer.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ChemViewer.app dist/ChemViewer-macos-arm64.zip
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemViewer-macos-arm64
          path: dist/ChemViewer-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
