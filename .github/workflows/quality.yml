name: ChemViewer checks
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    container: ${{ matrix.os == 'ubuntu-24.04' && 'swift:6.1.3@sha256:04b28d4aff67fa4ff4029d6e27dd40f9737cc69cc558a37b06f18b3dceb8942f' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        if: runner.os == 'Windows'
        with:
          swift-version: swift-6.1.3-release
          swift-build: 6.1.3-RELEASE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core XCTest with coverage
        if: runner.os != 'Windows'
        run: swift test --enable-code-coverage
      - name: Core XCTest on Windows
        if: runner.os == 'Windows'
        run: swift test
      - name: Enforce core coverage floors
        if: runner.os != 'Windows'
        shell: bash
        run: python scripts/check-coverage.py --swift "$(swift test --show-codecov-path)"
      - name: Migrated parser, editing and state assertions
        run: python scripts/check-building.py
      - name: BOS-TMC catalog numeric and coordinating-element regressions
        run: python -m unittest discover -s python_tests -p test_bostmc.py -v
      - name: Portable executable regression
        run: python scripts/check-portable.py --binary .build/debug/ChemViewerPortable${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Install browser harness
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Offline browser acceptance
        env:
          CHEMVIEWER_PORTABLE_BINARY: .build/debug/ChemViewerPortable${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python Tests/gui/portable/test_viewer.py
      - name: Build desktop chemistry service
        run: swift build --product ChemViewerService
      - name: Desktop service scientific and transaction regressions
        run: python scripts/check-desktop-service.py --binary .build/debug/ChemViewerService${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Install desktop harness and freezer
        run: python -m pip install -r desktop/requirements-build.txt
      - name: Install Linux desktop platform and software OpenGL
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y xvfb xauth libegl1 libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0 libglib2.0-0t64 libdbus-1-3
      - name: Native desktop GUI and GPU regressions
        shell: bash
        env:
          QT_OPENGL: ${{ runner.os == 'Windows' && 'software' || 'desktop' }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python -m coverage run --branch --source=desktop --data-file=.build/desktop.coverage Tests/gui/desktop/test_desktop.py
          else
            python -m coverage run --branch --source=desktop --data-file=.build/desktop.coverage Tests/gui/desktop/test_desktop.py
          fi
      - name: Exercise compatible GL 3.0 instancing and GLSL 1.30 path
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '3.0'
          MESA_GLSL_VERSION_OVERRIDE: '130'
        run: xvfb-run -a python -m coverage run --append --branch --source=desktop --data-file=.build/desktop.coverage Tests/gui/desktop/test_desktop.py
      - name: Enforce desktop module line and branch coverage
        run: |
          python -m coverage report --data-file=.build/desktop.coverage
          python -m coverage json --data-file=.build/desktop.coverage -o .build/desktop-coverage.json
          python scripts/check-desktop-coverage.py .build/desktop-coverage.json
      - name: Freeze native desktop and chemistry runtime
        run: python scripts/package-desktop.py
      - name: Execute relocated native desktop with developer PATH removed
        shell: bash
        env:
          QT_OPENGL: ${{ runner.os == 'Windows' && 'software' || 'desktop' }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a python scripts/check-desktop-package.py --archive dist/ChemViewer-desktop-linux.zip
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/check-desktop-package.py --archive dist/ChemViewer-desktop-win32.zip
          else
            python scripts/check-desktop-package.py --archive dist/ChemViewer-desktop-darwin.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChemViewer-desktop-${{ runner.os }}
          path: |
            dist/ChemViewer-desktop-*.zip
            .build/desktop-package-evidence/*
            .build/desktop-coverage.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Build portable release
        run: swift build -c release --product ChemViewerPortable
      - name: Package portable release
        run: python scripts/package-portable.py --output dist/ChemViewer-portable-${{ runner.os }}.zip
      - name: Execute relocated portable release ZIP
        run: python scripts/check-portable-package.py --archive dist/ChemViewer-portable-${{ runner.os }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChemViewer-portable-${{ runner.os }}
          path: dist/ChemViewer-portable-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: core-coverage-${{ runner.os }}
          path: .build/**/codecov/*.json
          if-no-files-found: error
          include-hidden-files: true
  scientific-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - name: All redistributable Python regressions with branch coverage
        run: python -m coverage run -m unittest discover -s python_tests -v
      - name: Coverage reports and floors
        run: |
          python -m coverage report
          python -m coverage xml
          python -m coverage json
          python scripts/check-coverage.py --python .build/python-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-${{ runner.os }}
          path: .build/python-coverage.*
          if-no-files-found: error
          include-hidden-files: true
  native-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          uname -m
          sw_vers
          swift --version
          xcodebuild -version
      - name: Build, XCTest and sign Apple Silicon app
        run: bash scripts/build-macos.sh --require-xctest
      - name: Verify Apple Silicon bundle
        run: |
          lipo -archs dist/ChemViewer.app/Contents/MacOS/ChemViewer | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 dist/ChemViewer.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ChemViewer.app dist/ChemViewer-macos-arm64.zip
      - name: Verify relocated app resources and missing-helper failure
        run: python3 scripts/check-macos-package.py --archive dist/ChemViewer-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChemViewer-macos-arm64
          path: dist/ChemViewer-macos-arm64.zip
          if-no-files-found: error
  release-gate:
    if: always()
    needs: [portable, scientific-python, native-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links and version declarations
        run: python3 scripts/check-docs.py
      - name: Require every platform and scientific job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not pass: ' + ', '.join(failed))
          print('All platform, scientific, browser, coverage and packaging gates passed.')
          PY
